<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevGuard</title>
    <meta name="description" content="Automated adversarial code review harness powered by Google GenAI Interactions API (gemini-3.8-flash) with empirical SQLite test verification." />
    <meta property="og:title" content="DevGuard" />
    <meta property="og:description" content="Automated adversarial code review harness powered by Google GenAI Interactions API (gemini-3.8-flash) with empirical SQLite test verification." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Suppress Vite HMR / WebSocket connection errors in iframe environment per build guidelines
      window.addEventListener('error', function (e) {
        if (
          (e.message && (e.message.includes('WebSocket') || e.message.includes('createWebSocketModuleRunnerTransport'))) ||
          (e.filename && e.filename.includes('@vite/client'))
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        if (
          e.reason &&
          e.reason.message &&
          (e.reason.message.includes('WebSocket') || e.reason.message.includes('createWebSocketModuleRunnerTransport'))
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body class="bg-[#0A0E17] text-slate-100 font-sans antialiased selection:bg-emerald-500/30 selection:text-emerald-200 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
